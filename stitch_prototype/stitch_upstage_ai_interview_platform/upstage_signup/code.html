<style type="text/tailwindcss">

<body class="bg-background min-h-screen flex items-center justify-center p-md">
<!-- Main Container - Transactional layout, no global nav -->
<main class="w-full max-w-md mx-auto">
<!-- Signup Card -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-lg p-xl shadow-[0px_4px_12px_rgba(0,0,0,0.02)]">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-display text-display text-primary mb-sm tracking-tight">UPSTAGE</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your account to begin</p>
</div>
<!-- Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="person">person</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-surface-variant rounded text-on-surface font-body-md text-body-md placeholder:text-outline-variant input-focus-ring" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-surface-variant rounded text-on-surface font-body-md text-body-md placeholder:text-outline-variant input-focus-ring" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-surface-variant rounded text-on-surface font-body-md text-body-md placeholder:text-outline-variant input-focus-ring" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Must be at least 8 characters.</p>
</div>
<!-- Confirm Password -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-body-lg" data-icon="lock_reset">lock_reset</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-surface-variant rounded text-on-surface font-body-md text-body-md placeholder:text-outline-variant input-focus-ring" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm pt-sm">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded border-surface-variant text-primary-container focus:ring-primary-container bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox">
</div>
<div class="text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Action Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                        Log in here
                    </a>
</p>
</div>
</div>
<!-- Minimal Decorative Footer -->
<div class="text-center mt-xl opacity-60">
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">SECURE PREPARATION ENVIRONMENT</p>
</div>
