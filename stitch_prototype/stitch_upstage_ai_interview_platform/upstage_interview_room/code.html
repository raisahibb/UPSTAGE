<body class="font-body-md text-on-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- Progress Bar Anchor -->
<div class="fixed top-0 left-0 w-full h-[4px] bg-surface-variant z-50">
<div class="h-full bg-primary-container" style="width: 30%; transition: width 0.5s ease-in-out;"></div>
</div>
<!-- Header Section -->
<header class="w-full max-w-container-max mx-auto px-lg pt-xl pb-md flex justify-between items-center z-10 relative">
<div class="flex items-center gap-sm">
<span class="font-headline-md text-headline-md text-on-surface">Question 3 of 10</span>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container-high px-sm py-[2px] rounded-DEFAULT">Software Engineering - Core</span>
</div>
<div class="flex items-center gap-md">
<div class="flex items-center gap-xs bg-surface-container border border-outline-variant rounded-lg px-md py-sm">
<span class="material-symbols-outlined text-[20px] text-error" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-headline-md text-headline-md text-on-surface w-[60px] text-center" id="interview-timer">14:59</span>
</div>
<button class="font-label-md text-label-md text-error hover:bg-error-container hover:text-on-error-container px-md py-sm rounded-lg transition-colors border border-transparent">
                Exit Interview
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[800px] mx-auto px-md py-lg flex flex-col gap-lg z-10 relative">
<!-- Question Card -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-lg p-lg shadow-[0_4px_12px_rgba(0,0,0,0.02)]">
<div class="flex items-start gap-md mb-md">
<div class="bg-surface-container text-on-surface-variant w-[32px] h-[32px] flex items-center justify-center rounded-DEFAULT font-label-md text-label-md shrink-0">
                    Q3
                </div>
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Explain the difference between a stack and a queue data structure.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Provide an example of a practical use case for each in software development.</p>
</div>
</div>
<div class="flex gap-sm mt-md">
<span class="font-label-sm text-label-sm bg-surface-container-low text-secondary px-sm py-[2px] border border-outline-variant rounded-full">Data Structures</span>
<span class="font-label-sm text-label-sm bg-surface-container-low text-secondary px-sm py-[2px] border border-outline-variant rounded-full">Algorithms</span>
</div>
</div>
<!-- Response Area -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-lg shadow-[0_4px_12px_rgba(0,0,0,0.02)] flex flex-col flex-grow min-h-[300px]">
<!-- Tabs -->
<div class="flex border-b border-surface-variant px-md pt-sm bg-surface-bright rounded-t-lg">
<button class="flex items-center gap-xs px-md py-sm font-label-md text-label-md text-primary-container border-b-2 border-primary-container bg-surface-container-lowest rounded-t-DEFAULT">
<span class="material-symbols-outlined text-[18px]">keyboard</span>
                    Text Answer
                </button>
<button class="flex items-center gap-xs px-md py-sm font-label-md text-label-md text-secondary hover:text-on-surface hover:bg-surface-container-low rounded-t-DEFAULT transition-colors">
<span class="material-symbols-outlined text-[18px]">mic</span>
                    Voice Answer
                </button>
</div>
<!-- Text Input Area -->
<div class="flex-grow p-md flex flex-col relative group">
<textarea class="w-full flex-grow resize-none border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface bg-transparent placeholder-outline" placeholder="Type your answer here... Be as detailed as possible." spellcheck="false"></textarea>
<!-- AI Assistant Hint (Subtle) -->
<div class="absolute bottom-md right-md flex items-center gap-xs bg-[#f5f3ff] text-primary-container px-sm py-[4px] rounded-DEFAULT border border-inverse-primary opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
<span class="material-symbols-outlined text-[16px]">tips_and_updates</span>
<span class="font-label-sm text-label-sm">Focus on LIFO vs FIFO concepts</span>
</div>
</div>
<!-- Formatting Toolbar (Minimal) -->

</button>

<span class="material-symbols-outlined text-[18px]">format_italic</span>
</button>

<span class="material-symbols-outlined text-[18px]">code</span>

<div class="font-label-sm text-label-sm text-outline">
                    0 words

<button class="flex items-center gap-xs font-label-md text-label-md text-on-surface-variant hover:text-on-surface px-md py-sm rounded-lg border border-transparent hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[20px]">chevron_left</span>
                Previous
            </button>
<div class="flex gap-md">
<button class="font-label-md text-label-md text-on-surface bg-transparent border border-outline-variant hover:bg-surface-container-low px-lg py-sm rounded-lg transition-colors">
                    Save Draft
                </button>
<button class="flex items-center gap-xs font-label-md text-label-md text-on-primary bg-primary-container hover:bg-[#28266b] px-xl py-sm rounded-lg shadow-sm transition-colors group">
                    Submit Answer
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">send</span>
</button>
</div>
</div>
</footer>
<script>
        // Simple timer logic for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('interview-timer');
            let timeLeft = 14 * 60 + 59; // 14:59

            const updateTimer = () => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 60) {
                    timerElement.parentElement.classList.replace('text-error', 'text-on-error-container');
                    timerElement.parentElement.classList.add('bg-error-container', 'border-error');
                }

                if (timeLeft > 0) {
                    timeLeft--;
                }
            };

            setInterval(updateTimer, 1000);
        });
    </script>
