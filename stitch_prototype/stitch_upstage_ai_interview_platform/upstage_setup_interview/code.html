<!-- Main Content -->
<main class="flex-grow flex flex-col items-center pt-xl pb-xl px-md sm:px-lg w-full max-w-container-max mx-auto">
<div class="w-full max-w-2xl bg-surface-container-lowest border border-surface-variant rounded-xl p-lg shadow-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Interview Setup</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">Configure your mock interview parameters.</p>
<form class="space-y-xl">
<!-- Domain Selection -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Interview Domain</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-md">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="domain" type="radio" value="software-dev">
<div class="p-md border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center">
<span class="material-symbols-outlined mb-xs text-primary">terminal</span>
<div class="font-label-md text-label-md text-on-surface">Software Dev</div>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="domain" type="radio" value="dsa">
<div class="p-md border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center">
<span class="material-symbols-outlined mb-xs text-primary">account_tree</span>
<div class="font-label-md text-label-md text-on-surface">DSA</div>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="domain" type="radio" value="databases">
<div class="p-md border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center">
<span class="material-symbols-outlined mb-xs text-primary">database</span>
<div class="font-label-md text-label-md text-on-surface">Databases</div>
</div>
</label>
</div>
</div>
<!-- Difficulty Selection -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Difficulty Level</label>
<div class="flex gap-sm">
<label class="cursor-pointer flex-1">
<input class="peer sr-only" name="difficulty" type="radio" value="easy">
<div class="py-sm px-md border border-outline-variant rounded-full peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center font-label-sm text-label-sm text-on-surface">
                                Easy
                            </div>
</label>
<label class="cursor-pointer flex-1">
<input checked="" class="peer sr-only" name="difficulty" type="radio" value="medium">
<div class="py-sm px-md border border-outline-variant rounded-full peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center font-label-sm text-label-sm text-on-surface">
                                Medium
                            </div>
</label>
<label class="cursor-pointer flex-1">
<input class="peer sr-only" name="difficulty" type="radio" value="hard">
<div class="py-sm px-md border border-outline-variant rounded-full peer-checked:border-primary peer-checked:bg-surface-tint/10 hover:bg-surface-container-low transition-colors text-center font-label-sm text-label-sm text-on-surface">
                                Hard
                            </div>
</label>
</div>
</div>
<!-- Duration -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block" for="duration">Duration (Minutes)</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none font-body-md text-body-md text-on-surface" id="duration" name="duration">
<option value="15">15 Minutes (Warm-up)</option>
<option selected="" value="30">30 Minutes (Standard)</option>
<option value="45">45 Minutes (Deep Dive)</option>
<option value="60">60 Minutes (Full Mock)</option>
</select>
</div>
<!-- Resume Upload -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Context: Upload Resume (Optional)</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-lg text-center bg-surface-bright hover:bg-surface-container-low transition-colors cursor-pointer" id="upload-area">
<span class="material-symbols-outlined text-outline text-display mb-sm">upload_file</span>
<p class="font-body-md text-body-md text-on-surface-variant">Drag and drop your resume here, or <span class="text-primary font-medium">browse files</span>.</p>
<p class="font-label-sm text-label-sm text-outline mt-xs">PDF or DOCX up to 5MB</p>
<input accept=".pdf,.doc,.docx" class="hidden" id="resume-upload" type="file">
</div>
<div class="hidden items-center justify-between p-md border border-outline-variant rounded-lg bg-surface-container-low mt-sm" id="file-display">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">description</span>
<span class="font-body-sm text-body-sm text-on-surface font-medium" id="filename">resume_jdoe_v2.pdf</span>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors" id="remove-file" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- CTA -->
<div class="pt-lg border-t border-surface-variant">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-md px-lg font-label-md text-label-md hover:bg-primary transition-colors flex items-center justify-center gap-sm" type="button">
                        Start Interview
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<script>
        // Simple file upload interaction script
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('resume-upload');
        const fileDisplay = document.getElementById('file-display');
        const filenameSpan = document.getElementById('filename');
        const removeBtn = document.getElementById('remove-file');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const fileName = this.files[0].name;
                filenameSpan.textContent = fileName;
                uploadArea.classList.add('hidden');
                fileDisplay.classList.remove('hidden');
                fileDisplay.classList.add('flex');
            }
        });

        removeBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileDisplay.classList.add('hidden');
            fileDisplay.classList.remove('flex');
            uploadArea.classList.remove('hidden');
        });
    </script>
</body></html>
