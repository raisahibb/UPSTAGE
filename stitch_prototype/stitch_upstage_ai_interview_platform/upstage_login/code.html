<body class="bg-background min-h-screen flex items-center justify-center p-md sm:p-lg antialiased">
<!-- Note: TopNavBar and SideNavBar are suppressed as this is a transactional Login page -->
<main class="w-full max-w-[440px] mx-auto">
<!-- Brand / Header -->
<div class="text-center mb-xl">
<h1 class="font-display text-display font-bold text-primary mb-sm">UPSTAGE</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome back to your workspace.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-lg sm:p-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-[48px] pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-[48px] pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary py-sm px-lg rounded font-label-md text-label-md hover:bg-primary-container/90 transition-colors active:scale-[0.98] mt-xl" type="submit">
                    Login
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">Create Account</a>
</p>
</div>
</main>
